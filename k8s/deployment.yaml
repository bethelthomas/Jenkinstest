apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-jenkins-demo
  labels:
    app: fast-jenkins-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-jenkins-demo
  template:
    metadata:
      labels:
        app: fast-jenkins-demo
    spec:
      containers:
        - name: fast-jenkins-demo
          image: fast-jenkins-demo:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['kubectl.kubernetes.io/last-applied-configuration']
---
apiVersion: v1
kind: Service
metadata:
  name: fast-jenkins-demo
spec:
  selector:
    app: fast-jenkins-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
